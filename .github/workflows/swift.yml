name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare App Structure & Entry Point
      run: |
        mkdir -p Sources
        if [ -f "ContentView.swift" ]; then
          cp ContentView.swift Sources/
        fi
        
        if ! grep -q "@main" Sources/*.swift 2>/dev/null; then
          cat << 'EOF' > Sources/SnapVaultApp.swift
        import SwiftUI

        @main
        struct SnapVaultApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF
        fi

    - name: Generate Ghost App Icon (Exact 1024x1024)
      run: |
        mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
        cat << 'EOF' > Sources/Assets.xcassets/Contents.json
        {
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        EOF

        cat << 'EOF' > generate_icon.swift
        import AppKit

        let width = 1024
        let height = 1024
        let rep = NSBitmapImageRep(
            bitmapDataPlanes: nil,
            pixelsWide: width,
            pixelsHigh: height,
            bitsPerSample: 8,
            samplesPerPixel: 4,
            hasAlpha: true,
            isPlanar: false,
            colorSpaceName: .deviceRGB,
            bytesPerRow: 0,
            bitsPerPixel: 0
        )!

        NSGraphicsContext.saveGraphicsState()
        NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
        guard let ctx = NSGraphicsContext.current?.cgContext else { exit(1) }

        // 1. خلفية صفراء
        ctx.setFillColor(CGColor(red: 1.0, green: 0.95, blue: 0.0, alpha: 1.0))
        ctx.fill(CGRect(x: 0, y: 0, width: width, height: height))

        // 2. رسم جسم الشبح الأبيض
        let path = CGMutablePath()
        path.move(to: CGPoint(x: 260, y: 240))
        path.addLine(to: CGPoint(x: 260, y: 580))
        path.addArc(center: CGPoint(x: 512, y: 580), radius: 252, startAngle: .pi, endAngle: 0, clockwise: true)
        path.addLine(to: CGPoint(x: 764, y: 240))
        path.addQuadCurve(to: CGPoint(x: 638, y: 240), control: CGPoint(x: 701, y: 150))
        path.addQuadCurve(to: CGPoint(x: 512, y: 240), control: CGPoint(x: 575, y: 310))
        path.addQuadCurve(to: CGPoint(x: 386, y: 240), control: CGPoint(x: 449, y: 150))
        path.addQuadCurve(to: CGPoint(x: 260, y: 240), control: CGPoint(x: 323, y: 310))
        path.closeSubpath()

        ctx.saveGState()
        ctx.setShadow(offset: CGSize(width: 0, height: -15), blur: 30, color: CGColor(gray: 0, alpha: 0.25))
        ctx.addPath(path)
        ctx.setFillColor(CGColor(red: 1, green: 1, blue: 1, alpha: 1))
        ctx.fillPath()
        ctx.restoreGState()

        ctx.addPath(path)
        ctx.setStrokeColor(CGColor(red: 0, green: 0, blue: 0, alpha: 1))
        ctx.setLineWidth(28)
        ctx.setLineJoin(.round)
        ctx.strokePath()

        // 3. عيون الشبح
        ctx.setFillColor(CGColor(red: 0.08, green: 0.08, blue: 0.08, alpha: 1))
        ctx.fillEllipse(in: CGRect(x: 395, y: 570, width: 58, height: 82))
        ctx.fillEllipse(in: CGRect(x: 571, y: 570, width: 58, height: 82))

        ctx.setFillColor(CGColor(red: 1, green: 1, blue: 1, alpha: 1))
        ctx.fillEllipse(in: CGRect(x: 408, y: 615, width: 20, height: 20))
        ctx.fillEllipse(in: CGRect(x: 584, y: 615, width: 20, height: 20))

        // 4. سهم التحميل الأسود
        let arrow = CGMutablePath()
        arrow.move(to: CGPoint(x: 482, y: 490))
        arrow.addLine(to: CGPoint(x: 542, y: 490))
        arrow.addLine(to: CGPoint(x: 542, y: 390))
        arrow.addLine(to: CGPoint(x: 600, y: 390))
        arrow.addLine(to: CGPoint(x: 512, y: 295))
        arrow.addLine(to: CGPoint(x: 424, y: 390))
        arrow.addLine(to: CGPoint(x: 482, y: 390))
        arrow.closeSubpath()

        ctx.addPath(arrow)
        ctx.setFillColor(CGColor(red: 0.08, green: 0.08, blue: 0.08, alpha: 1))
        ctx.fillPath()

        NSGraphicsContext.restoreGraphicsState()

        if let png = rep.representation(using: .png, properties: [:]) {
            try! png.write(to: URL(fileURLWithPath: "Sources/Assets.xcassets/AppIcon.appiconset/icon.png"))
        }
        EOF
        swift generate_icon.swift
        rm generate_icon.swift

        cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
        {
          "images" : [
            {
              "filename" : "icon.png",
              "idiom" : "universal",
              "platform" : "ios",
              "size" : "1024x1024"
            }
          ],
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        EOF

    - name: Generate Xcode Project via XcodeGen
      run: |
        cat << 'EOF' > project.yml
        name: SnapVault
        options:
          bundleIdPrefix: com.xhamad0
        targets:
          SnapVault:
            type: application
            platform: iOS
            deploymentTarget: "16.0"
            sources:
              - Sources
            info:
              path: Sources/Info.plist
              properties:
                CFBundleDisplayName: SnapVault
                UILaunchScreen: {}
                UISupportedInterfaceOrientations:
                  - UIInterfaceOrientationPortrait
                NSFaceIDUsageDescription: "لحماية المحفوظات ببصمة الوجه"
                NSPhotoLibraryAddUsageDescription: "لحفظ المقاطع المختارة في ألبوم الصور"
                UIBackgroundModes:
                  - audio
                  - fetch
                  - processing
            settings:
              PRODUCT_BUNDLE_IDENTIFIER: com.xhamad0.snapvault
              ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
        EOF
        brew install xcodegen
        xcodegen generate

    - name: Build and Package IPA
      run: |
        xcodebuild -project SnapVault.xcodeproj \
                   -scheme SnapVault \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   clean build
        
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/SnapVault.app Payload/
        zip -r SnapVault.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnapVault-IPA
        path: SnapVault.ipa
